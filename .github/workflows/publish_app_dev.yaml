name: app-build-action-dev

on:
  workflow_dispatch:
  push:
    tags:
      - "dev_v*"

jobs:
  build-android-apk-only:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"
          cache: "gradle"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.x"
          cache: true

      - name: Restore packages
        run: |
          cd simple_live_app
          flutter pub get

      - name: Patch Android build settings
        run: |
          # 1) 给项目一个假的 key.properties，避免 build.gradle.kts 读取签名配置时拿到空值
          cat > simple_live_app/android/key.properties <<'EOF'
          storeFile=dummy.jks
          storePassword=dummy
          keyPassword=dummy
          keyAlias=dummy
          EOF

          # 2) 修复 Kotlin 版本不匹配：日志里 kotlin-stdlib 是 2.3.21，但项目 Kotlin Gradle plugin 期望 2.1.0
          python3 - <<'PY'
          from pathlib import Path
          import re

          targets = [
              Path('simple_live_app/android/settings.gradle'),
              Path('simple_live_app/android/settings.gradle.kts'),
              Path('simple_live_app/android/build.gradle'),
              Path('simple_live_app/android/build.gradle.kts'),
          ]

          changed = False
          for p in targets:
              if not p.exists():
                  continue
              s = p.read_text(encoding='utf-8')
              old = s
              s = re.sub(r'id\("org\.jetbrains\.kotlin\.android"\)\s+version\s+"[^"]+"',
                         'id("org.jetbrains.kotlin.android") version "2.3.21"', s)
              s = re.sub(r"id\('org\.jetbrains\.kotlin\.android'\)\s+version\s+'[^']+'",
                         "id('org.jetbrains.kotlin.android') version '2.3.21'", s)
              s = re.sub(r'ext\.kotlin_version\s*=\s*"[^"]+"',
                         'ext.kotlin_version = "2.3.21"', s)
              s = re.sub(r"ext\.kotlin_version\s*=\s*'[^']+'",
                         "ext.kotlin_version = '2.3.21'", s)
              if s != old:
                  p.write_text(s, encoding='utf-8')
                  print(f'Patched Kotlin version in {p}')
                  changed = True

          if not changed:
              print('No Kotlin plugin version line was found to patch. Continue build anyway.')
          PY

      - name: Build APK only
        run: |
          cd simple_live_app
          flutter build apk --debug

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: simplelive-debug-apk
          path: simple_live_app/build/app/outputs/flutter-apk/app-debug.apk
